version: 2

updates:
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      # The Microsoft.* packages move together on every servicing release; one pull request per
      # month beats fifteen.
      microsoft:
        patterns:
          - "Microsoft.*"
          - "System.*"
      test-tooling:
        patterns:
          - "xunit*"
          - "coverlet*"
          - "FluentAssertions"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
